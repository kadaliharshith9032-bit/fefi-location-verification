<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FEFI MOTOCORP | Interview Location Verification</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f8fc;
    color: #14243a;
}

header {
    background: #102d4d;
    color: white;
    padding: 30px 7%;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 5px 0 0;
}

.container {
    max-width: 900px;
    margin: 35px auto;
    padding: 30px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 18px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    box-sizing: border-box;
    border: 1px solid #ccd6e0;
    border-radius: 8px;
    font-size: 15px;
}

.consent {
    margin-top: 20px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
}

.consent input {
    width: auto;
    margin-top: 3px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    border: none;
    border-radius: 8px;
    background: #087f42;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #066b37;
}

button:disabled {
    background: #aebdca;
    cursor: not-allowed;
}

#result {
    display: none;
    margin-top: 25px;
    padding: 20px;
    background: #eef9f2;
    border-radius: 10px;
    border: 1px solid #b7dfc5;
}

#error {
    margin-top: 20px;
    color: #b00020;
    font-weight: bold;
}

.success {
    color: #087f42;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>FEFI</h1>
    <p>FEFI MOTOCORP PRIVATE LIMITED</p>
</header>

<div class="container">

    <h2>Interview Location Verification</h2>

    <p>
        Please verify your current location before proceeding to the
        FEFI certification interview.
    </p>

    <label>Employee ID</label>
    <input type="text" id="employeeId" placeholder="e.g. FEFI2719">

    <label>Full Name</label>
    <input type="text" id="fullName" placeholder="Enter your full name">

    <label>Department / Role</label>
    <select id="department">
        <option value="">Select your department</option>
        <option>Technical & Training</option>
        <option>R&D</option>
        <option>Marketing & Business Development</option>
        <option>Operations</option>
        <option>Trainee Engineer</option>
        <option>Other</option>
    </select>

    <div class="consent">
        <input type="checkbox" id="consent">
        <label for="consent" style="margin:0;font-weight:normal;">
            I understand that FEFI MOTOCORP will collect my current
            device location once for interview/assessment verification.
        </label>
    </div>

    <button id="verifyBtn">
        📍 Verify My Location
    </button>

    <div id="error"></div>

    <div id="result">

        <div class="success">
            ✓ Location Verified Successfully
        </div>

        <p><strong>Employee ID:</strong>
            <span id="showEmployee"></span>
        </p>

        <p><strong>Name:</strong>
            <span id="showName"></span>
        </p>

        <p><strong>Department:</strong>
            <span id="showDepartment"></span>
        </p>

        <p><strong>Latitude:</strong>
            <span id="latitude"></span>
        </p>

        <p><strong>Longitude:</strong>
            <span id="longitude"></span>
        </p>

        <p><strong>Accuracy:</strong>
            <span id="accuracy"></span> metres
        </p>

        <button id="proceedBtn">
            ➜ Proceed to Interview
        </button>

    </div>

</div>

<script>

const verifyBtn = document.getElementById("verifyBtn");
const proceedBtn = document.getElementById("proceedBtn");

verifyBtn.addEventListener("click", function () {

    const employeeId =
        document.getElementById("employeeId").value.trim();

    const fullName =
        document.getElementById("fullName").value.trim();

    const department =
        document.getElementById("department").value;

    const consent =
        document.getElementById("consent").checked;

    const error =
        document.getElementById("error");

    error.textContent = "";

    if (!employeeId || !fullName || !department) {
        error.textContent =
            "Please complete Employee ID, Full Name and Department.";
        return;
    }

    if (!consent) {
        error.textContent =
            "Please confirm the location-use consent.";
        return;
    }

    if (!navigator.geolocation) {
        error.textContent =
            "Geolocation is not supported by this browser.";
        return;
    }

    verifyBtn.disabled = true;
    verifyBtn.textContent = "Getting your location...";

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            document.getElementById("showEmployee").textContent =
                employeeId;

            document.getElementById("showName").textContent =
                fullName;

            document.getElementById("showDepartment").textContent =
                department;

            document.getElementById("latitude").textContent =
                lat.toFixed(6);

            document.getElementById("longitude").textContent =
                lng.toFixed(6);

            document.getElementById("accuracy").textContent =
                Math.round(accuracy);

            document.getElementById("result").style.display = "block";

            verifyBtn.textContent = "✓ Location Verified";

        },

        function(error) {

            verifyBtn.disabled = false;
            verifyBtn.textContent = "📍 Verify My Location";

            if (error.code === 1) {
                document.getElementById("error").textContent =
                    "Location permission was denied. Please allow location access in your browser settings.";
            }

            else if (error.code === 2) {
                document.getElementById("error").textContent =
                    "Your location could not be determined. Please check GPS/location services.";
            }

            else if (error.code === 3) {
                document.getElementById("error").textContent =
                    "Location request timed out. Please try again.";
            }

            else {
                document.getElementById("error").textContent =
                    "Unable to obtain your location.";
            }

        },

        {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
        }

    );

});


proceedBtn.addEventListener("click", function () {

    window.location.href =
        "https://forms.cloud.microsoft/r/YBRWAiPgTS";

});
</script>

</body>
</html>
